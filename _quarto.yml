project:
  type: website
  output-dir: _site
  resources:
    - files/
    - images/

lang: en

website:
  title: "Gustavo Meza Hinojo"
  site-url: https://gmezah.github.io
  description: "Economist and public policy specialist. Data analysis on jobs, poverty and development in Peru."
  favicon: images/favicon.png
  open-graph: true
  navbar:
    left:
      - href: index.qmd
        text: About
      - href: data/index.qmd
        text: Data
      - href: reports/index.qmd
        text: Reports
      - href: media/index.qmd
        text: Media
    right:
      - icon: linkedin
        href: https://www.linkedin.com/in/gustavo-meza-hinojo/
        aria-label: LinkedIn
      - icon: github
        href: https://github.com/GMEZAH
        aria-label: GitHub
      - icon: envelope
        href: mailto:gustavo.meza@pucp.edu.pe
        aria-label: Email
  page-footer:
    left: "© 2026 Gustavo Meza Hinojo"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: [cosmo, styles/base.scss, styles/light.scss]
      dark: [cosmo, styles/base.scss, styles/dark.scss]
    respect-user-color-scheme: true
    link-external-newwindow: true
    link-external-icon: false
    smooth-scroll: true

execute:
  freeze: auto
  echo: false
  warning: false
